<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Happy Toys Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-slate-100 flex flex-col">

  <div id="adminLoginModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-200">
      <div class="text-center mb-6">
        <div class="w-14 h-14 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl mx-auto mb-3 shadow-md">🔒</div>
        <h2 class="text-2xl font-bold text-slate-900">Admin Authentication</h2>
      </div>
      <form id="adminLoginForm" class="space-y-4">
        <input id="adminPasswordInput" type="password" required placeholder="Enter password" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-blue-600 text-sm" />
        <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow transition">Secure Login</button>
      </form>
    </div>
  </div>

  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🧸</span>
        <div>
          <h1 class="brand-font text-lg font-bold tracking-tight">Happy Toys Admin</h1>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <a href="index.html" target="_blank" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200">View Store ↗</a>
        <button id="adminLogoutBtn" class="px-3 py-1.5 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-xs font-semibold text-red-300">Logout</button>
      </div>
    </div>
    <div class="rainbow-bar"></div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <!-- VIP Splash Media Upload -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-8">
      <h3 class="text-lg font-bold text-slate-900 mb-1">🎬 VIP Splash Screen Video</h3>
      <p class="text-xs text-slate-500 mb-4">Select a video from your gallery (for testing) OR paste a direct URL (for customers).</p>
      
      <div class="space-y-4">
          <div>
             <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1.5">Option 1: Choose Video from Gallery</label>
             <!-- ACCEPT ATTRIBUTE FIXED FOR ALL VIDEOS -->
             <input id="splashMediaUpload" type="file" accept="video/*, video/mp4, image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 cursor-pointer border border-slate-200 rounded-xl" />
          </div>
          <div>
             <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1.5">Option 2: Paste Global Video URL (Recommended)</label>
             <input id="adminIntroGifUrl" type="text" placeholder="https://example.com/video.mp4" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-blue-600 focus:outline-none bg-slate-50" />
          </div>
          <button id="saveMediaBtn" class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow transition">Save Splash Video</button>
      </div>
      <div id="splashPreview" class="mt-4 hidden w-full max-w-sm rounded-xl overflow-hidden border-4 border-slate-100 bg-slate-900"></div>
    </div>

    <!-- Product Catalog Manager -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <h2 class="text-2xl font-bold text-slate-900">Product Catalog</h2>
      <div class="flex items-center gap-2">
        <button id="openAddProductModalBtn" class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow transition">+ Add New Toy</button>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-50/75 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
              <th class="py-3 px-4">Toy Details</th>
              <th class="py-3 px-4">SKU / Category</th>
              <th class="py-3 px-4">Price (PKR)</th>
              <th class="py-3 px-4">Stock</th>
              <th class="py-3 px-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="adminProductTableBody" class="divide-y divide-slate-100 text-xs sm:text-sm"></tbody>
        </table>
      </div>
    </div>
  </main>
  
  <div id="productModal" class="fixed inset-0 z-50 hidden bg-slate-950/70 backdrop-blur-sm overflow-y-auto p-4 flex items-center justify-center">
      <!-- Shortened for brevity, form fields remain same -->
      <div class="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl my-8">
        <div class="flex items-center justify-between pb-4 border-b border-slate-200 mb-6">
          <h3 id="productModalTitle" class="text-xl font-bold text-slate-900">Add New Toy Product</h3>
          <button id="closeProductModalBtn" class="p-2 rounded-lg text-slate-400 hover:bg-slate-100">✕</button>
        </div>
        <form id="productForm" class="space-y-5">
          <input type="hidden" id="editProductId" />
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Product Name *</label><input id="prodName" type="text" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-blue-600 focus:outline-none" /></div>
            <div><label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Unique SKU *</label><input id="prodSku" type="text" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-blue-600 focus:outline-none" /></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div><label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Exact Category *</label><select id="prodCategory" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white focus:border-blue-600 focus:outline-none"></select></div>
            <div><label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Stock</label><input id="prodStock" type="number" min="0" value="10" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-blue-600 focus:outline-none" /></div>
            <div><label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Price (PKR) *</label><input id="prodPrice" type="number" required min="0" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-blue-600 focus:outline-none" /></div>
          </div>
          <div><label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Description</label><textarea id="prodShortDesc" rows="2" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-blue-600 focus:outline-none"></textarea></div>
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
            <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Upload Photo</label>
            <input id="imageUploadInput" type="file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 mb-3 cursor-pointer" />
            <input id="prodMainImage" type="hidden" />
            <div id="imagePreviewContainer" class="flex flex-wrap gap-2"></div>
          </div>
          <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow">Save Toy</button>
          </div>
        </form>
      </div>
  </div>

  <script src="js/data-seed.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
