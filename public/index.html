<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Toys Store | Premium Kids Toys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body.splash-active { overflow: hidden; }
    
    .toy-title-font {
      font-family: 'Fredoka One', cursive, sans-serif;
      letter-spacing: 1px;
    }

    /* Smooth Floating / Bouncing Animation for Store Name */
    @keyframes float-text {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.02); }
    }
    .animate-float-text {
      animation: float-text 2.5s ease-in-out infinite;
    }

    /* Vibrant Gradient Button Glow */
    .btn-vip-gradient {
      background: linear-gradient(135deg, #ff7e5f, #feb47b, #ffcc00);
      background-size: 200% 200%;
      animation: gradient-anim 4s ease infinite;
      box-shadow: 0 10px 25px rgba(255, 126, 95, 0.4);
      transition: all 0.3s ease;
    }
    @keyframes gradient-anim {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn-vip-gradient:hover {
      transform: scale(1.04);
      box-shadow: 0 15px 30px rgba(255, 204, 0, 0.6);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col splash-active bg-slate-900">

  <!-- VIP SPLASH MODAL WINDOW -->
  <div id="vipSplashScreen" class="fixed inset-0 z-[100] flex items-center justify-center bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 p-4 sm:p-6 transition-all duration-700 overflow-y-auto">
    
    <!-- White Card Container (Identical for Mobile & Desktop) -->
    <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-[0_25px_60px_rgba(0,0,0,0.5)] border-4 border-amber-300 overflow-hidden relative flex flex-col my-auto p-5 sm:p-6">
      
      <!-- Close Button -->
      <button onclick="HappyToysApp.enterStore()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 z-50 p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>

      <!-- VIDEO SECTION -->
      <div class="w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden shadow-md relative flex items-center justify-center border-2 border-slate-100 mb-5">
        <div id="splashMediaPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400">
          <span class="text-xs font-bold">Loading Video...</span>
        </div>
        <video id="splashVideoPlayer" class="w-full h-full object-cover hidden z-10" controls autoplay loop muted playsinline></video>
        <img id="splashImgPlayer" class="w-full h-full object-cover hidden z-10" alt="Splash Image" />
      </div>

      <!-- STORE NAME WITH BOUNCING ANIMATION -->
      <div class="text-center flex flex-col items-center">
        <h1 class="toy-title-font text-2xl sm:text-3xl text-amber-500 tracking-wide uppercase mb-1 animate-float-text drop-shadow-sm">
          HAPPY TOYS STORE
        </h1>
        <p class="text-slate-500 text-xs sm:text-sm font-bold mb-4 tracking-wide">
          ✨ Best Toys for Every Smile ✨
        </p>

        <!-- Animated Teddy Badge -->
        <div class="w-16 h-16 rounded-full bg-amber-100 border-4 border-amber-400 shadow-inner flex items-center justify-center text-3xl mb-4 animate-float-text relative">
          🧸
          <span class="absolute -top-1 -right-1 text-xs">✨</span>
        </div>

        <!-- Key Features Cards -->
        <div class="grid grid-cols-3 gap-2 w-full mb-5">
          <div class="bg-sky-50/80 border border-sky-100 rounded-2xl p-2.5 flex flex-col items-center shadow-sm">
            <span class="text-lg mb-1">🛡️</span>
            <span class="text-[9px] font-extrabold text-sky-800 uppercase tracking-tighter">PREMIUM QUALITY</span>
          </div>
          <div class="bg-amber-50/80 border border-amber-100 rounded-2xl p-2.5 flex flex-col items-center shadow-sm">
            <span class="text-lg mb-1">🚀</span>
            <span class="text-[9px] font-extrabold text-amber-800 uppercase tracking-tighter">FAST DELIVERY</span>
          </div>
          <div class="bg-pink-50/80 border border-pink-100 rounded-2xl p-2.5 flex flex-col items-center shadow-sm">
            <span class="text-lg mb-1">😊</span>
            <span class="text-[9px] font-extrabold text-pink-800 uppercase tracking-tighter">HAPPY KIDS</span>
          </div>
        </div>

        <!-- Enter Store Button -->
        <button onclick="HappyToysApp.enterStore()" class="btn-vip-gradient w-full py-3.5 rounded-2xl text-white font-black text-lg flex items-center justify-center gap-2 shadow-md cursor-pointer">
          <span>Enter Store ➔</span>
        </button>
      </div>

    </div>
  </div>

  <!-- MAIN STORE CONTENT -->
  <div id="mainStoreContent" class="flex flex-col flex-1 opacity-0 h-0 overflow-hidden">
    <div class="rainbow-bar"></div>
    <div class="bg-slate-900 text-white text-xs sm:text-sm py-2 px-4 text-center font-medium">
      🎉 Welcome to Happy Toys Store! Fast Delivery Across Pakistan
    </div>

    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <button id="openCategoryDrawerBtn" class="p-2 rounded-xl bg-slate-100 text-slate-700"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 6h16M4 12h16M4 18h10"/></svg></button>
          <a href="#" onclick="HappyToysApp.resetFilters(); return false;" class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-red-500 to-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-sm">🧸</div>
            <div>
              <span class="toy-title-font text-base text-amber-500 tracking-tight leading-none block">Happy Toys</span>
            </div>
          </a>
        </div>
        <div class="flex items-center gap-2 sm:gap-3">
          <a href="admin.html" class="text-xs sm:text-sm font-semibold px-3 py-2 rounded-xl bg-slate-100 text-slate-700">Admin</a>
          <button onclick="HappyToysCart.openDrawer()" class="px-3.5 py-2 rounded-xl bg-blue-600 text-white font-semibold text-xs sm:text-sm">🛒 Cart <span id="cartCountBadge" class="px-1.5 py-0.5 text-[11px] rounded-full bg-amber-400 text-slate-900 font-bold">0</span></button>
        </div>
      </div>
    </header>

    <div id="categoryDrawerContainer" class="fixed inset-0 z-50 hidden">
      <div id="categoryDrawerBackdrop" class="drawer-backdrop fixed inset-0"></div>
      <aside class="drawer-panel relative z-10 w-80 max-w-[85vw] bg-white h-full shadow-2xl flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between bg-slate-50">
          <span class="font-bold">🧸 Categories</span>
          <button id="closeCategoryDrawerBtn" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-200">✕</button>
        </div>
        <div id="drawerCategoryList" class="p-3 overflow-y-auto space-y-1"></div>
      </aside>
    </div>

    <main class="flex-1">
      <section class="bg-white border-b border-slate-200"><div class="max-w-7xl mx-auto px-4 py-3"><div id="horizontalCategoryBar" class="flex items-center gap-2 overflow-x-auto no-scrollbar"></div></div></section>
      <section class="max-w-7xl mx-auto px-4 py-8">
        <h2 id="activeCategoryHeading" class="text-2xl font-bold mb-6">All Toys</h2>
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>
    </main>
  </div>

  <script src="js/data-seed.js"></script>
  <script src="js/product-modal.js"></script>
  <script src="js/cart-whatsapp.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Trigger continuous fireworks/confetti on load!
    window.addEventListener('DOMContentLoaded', () => {
       if(typeof confetti === 'function') {
           var count = 200;
           var defaults = { origin: { y: 0.7 } };
           function fire(particleRatio, opts) {
             confetti(Object.assign({}, defaults, opts, { particleCount: Math.floor(count * particleRatio) }));
           }
           fire(0.25, { spread: 26, startVelocity: 55 });
           fire(0.2, { spread: 60 });
           fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
           fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
           fire(0.1, { spread: 120, startVelocity: 45 });
       }
    });
  </script>
</body>
</html>
