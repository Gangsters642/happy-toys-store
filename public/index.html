<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Toys Store | Premium Kids Toys</title>
  <link rel="preload" href="/api/splash-media" as="video" type="video/mp4" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; }
    body.splash-active { overflow: hidden; }
    .toy-title-font { font-family: 'Fredoka One', cursive, sans-serif; letter-spacing: 0.5px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .rainbow-bar {
      height: 6px;
      width: 100%;
      background: linear-gradient(90deg, #ef4444 0% 20%, #f59e0b 20% 40%, #3b82f6 40% 60%, #10b981 60% 80%, #a855f7 80% 100%);
    }
    .card-rainbow-strip {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, #ef4444 0% 16.6%, #f59e0b 16.6% 33.3%, #10b981 33.3% 50%, #3b82f6 50% 66.6%, #6366f1 66.6% 83.3%, #ec4899 83.3% 100%);
    }

    @keyframes float-text {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float-text { animation: float-text 2.5s ease-in-out infinite; }

    .btn-vip-gradient {
      background: linear-gradient(135deg, #ff7e5f, #feb47b, #ffcc00);
      background-size: 200% 200%;
      animation: gradient-anim 4s ease infinite;
      box-shadow: 0 10px 25px rgba(255, 126, 95, 0.4);
    }
    @keyframes gradient-anim {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .toy-card-reveal {
      opacity: 0;
      transform: translateY(35px) scale(0.95);
      transition: opacity 0.55s ease, transform 0.55s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .toy-card-reveal.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .toy-card:active, .toy-card.card-selected-yellow {
      border: 2.5px solid #f59e0b !important;
      box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.35), 0 15px 30px rgba(245, 158, 11, 0.25) !important;
      transform: scale(1.04) translateY(-4px) !important;
      z-index: 20 !important;
    }

    @keyframes reanimate3D {
      0% { opacity: 0; transform: perspective(600px) rotateY(30deg) translateY(30px) scale(0.88); }
      100% { opacity: 1; transform: perspective(600px) rotateY(0deg) translateY(0) scale(1); }
    }
    .reanimate-3d-card {
      animation: reanimate3D 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    }

    @keyframes categorySlideIn {
      from { opacity: 0; transform: translateX(-25px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .drawer-category-item {
      opacity: 0;
      animation: categorySlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col splash-active bg-slate-50">

  <!-- VIP SPLASH MODAL FIXED -->
  <div id="vipSplashScreen" class="fixed inset-0 z-[100] flex items-center justify-center bg-gradient-to-br from-sky-100 via-amber-50 to-pink-100 p-4 sm:p-6 overflow-y-auto">
    <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-[0_25px_60px_rgba(0,0,0,0.15)] border-4 border-amber-300 overflow-hidden relative flex flex-col my-auto p-5 sm:p-6">
      <button type="button" onclick="HappyToysApp.enterStore()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 z-50 p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition cursor-pointer">✕</button>

      <div class="w-full aspect-video bg-amber-50/50 rounded-2xl overflow-hidden shadow-sm relative flex items-center justify-center border-2 border-amber-100 mb-5">
        <video id="splashVideoPlayer" src="/api/splash-media" preload="auto" class="w-full h-full object-cover z-10" autoplay loop muted playsinline></video>
      </div>

      <div class="text-center flex flex-col items-center">
        <h1 class="toy-title-font text-2xl sm:text-3xl text-amber-500 tracking-wide uppercase mb-1 animate-float-text">HAPPY TOYS STORE</h1>
        <p class="text-slate-500 text-xs sm:text-sm font-bold mb-4">✨ Best Toys for Every Smile ✨</p>
        <div class="w-16 h-16 rounded-full bg-amber-100 border-4 border-amber-400 shadow-inner flex items-center justify-center text-3xl mb-4 animate-float-text">🧸</div>
        <button type="button" onclick="HappyToysApp.enterStore()" class="btn-vip-gradient w-full py-3.5 rounded-2xl text-white font-black text-lg flex items-center justify-center gap-2 shadow-md cursor-pointer">
          <span>Enter Store ➔</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN STORE CONTENT -->
  <div id="mainStoreContent" class="flex flex-col flex-1 bg-slate-50">
    <div class="rainbow-bar"></div>
    <div class="bg-slate-900 text-white text-xs py-2 px-4 text-center font-bold">
      🎉 Welcome to Happy Toys Store! Fast Delivery Across Pakistan
    </div>

    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-100 shadow-xs">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <button type="button" id="openCategoryDrawerBtn" class="w-10 h-10 rounded-2xl bg-slate-100 text-slate-700 hover:bg-slate-200 flex items-center justify-center transition cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M4 6h16M4 12h16M4 18h10"/></svg>
          </button>
          <a href="#" onclick="HappyToysApp.resetFilters(); return false;" class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 flex items-center justify-center text-xl shadow-sm">🧸</div>
            <span class="toy-title-font text-lg sm:text-xl text-amber-500 tracking-tight">Happy Toys</span>
          </a>
        </div>
        <div class="flex items-center gap-2">
          <a href="admin.html" class="text-xs sm:text-sm font-extrabold px-4 py-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-800 transition">Admin</a>
          <button type="button" onclick="HappyToysCart.openDrawer()" class="px-4 py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs sm:text-sm shadow-sm flex items-center gap-1.5 transition cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            <span>Cart</span>
            <span id="cartCountBadge" class="w-5 h-5 text-[11px] rounded-full bg-amber-400 text-slate-900 font-black flex items-center justify-center">0</span>
          </button>
        </div>
      </div>
    </header>

    <!-- SIDEBAR CATEGORY DRAWER -->
    <div id="categoryDrawerContainer" class="fixed inset-0 z-50 hidden">
      <div id="categoryDrawerBackdrop" class="fixed inset-0 bg-black/50 backdrop-blur-xs"></div>
      <aside class="relative z-10 w-80 max-w-[85vw] bg-white h-full shadow-2xl flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
          <span class="toy-title-font text-lg text-amber-500">🧸 Toy Categories</span>
          <button type="button" id="closeCategoryDrawerBtn" class="w-8 h-8 rounded-lg text-slate-500 hover:bg-slate-200 font-bold cursor-pointer">✕</button>
        </div>
        <div class="p-3 border-b border-slate-100 bg-amber-50/50">
          <button type="button" onclick="HappyToysApp.resetFilters(); document.getElementById('categoryDrawerContainer').classList.add('hidden');" class="w-full text-left px-4 py-3 rounded-xl text-sm font-black text-amber-900 bg-amber-200/70 hover:bg-amber-200 transition flex items-center gap-3 cursor-pointer">
            <span class="text-lg">🏠</span>
            <span>Home / All Toys</span>
          </button>
        </div>
        <div id="drawerCategoryList" class="p-3 overflow-y-auto space-y-1.5 flex-1"></div>
      </aside>
    </div>

    <main class="flex-1">
      <section class="bg-white border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3">
          <div id="horizontalCategoryBar" class="flex items-center gap-2.5 overflow-x-auto no-scrollbar py-0.5"></div>
        </div>
      </section>

      <section class="max-w-7xl mx-auto px-3 sm:px-6 py-6">
        <div class="flex items-center justify-between mb-4"><h2 id="activeCategoryHeading" class="text-2xl font-black text-slate-900">All Toys</h2><select id="sortDropdown" onchange="window.HappyToysApp && window.HappyToysApp.sortProducts(this.value)" class="bg-white border border-slate-200 text-slate-700 font-bold text-xs px-3 py-1.5 rounded-xl shadow-sm outline-none focus:border-amber-400 cursor-pointer"><option value="default">Sort: Default</option><option value="price_asc">Price: Low to High</option><option value="price_desc">Price: High to Low</option><option value="az">A to Z</option></select></div>
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3.5 sm:gap-5"></div>
      </section>
    </main>
  </div>

  <script src="js/data-seed.js?v=25?v=15"></script>
  <script src="js/product-modal.js?v=25?v=15"></script>
  <script src="js/cart-whatsapp.js?v=25?v=15"></script>
  <script src="js/app.js?v=25?v=15"></script>
<script src="/js/security.js?v=6"></script>
</body>
</html>
