<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Toys Store | Premium Kids Toys</title>
  <link rel="preload" href="/api/splash-media" as="video" type="video/mp4" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body.splash-active { overflow: hidden; }
    
    .toy-title-font {
      font-family: 'Fredoka One', cursive, sans-serif;
      letter-spacing: 1px;
    }

    @keyframes float-text {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.02); }
    }
    .animate-float-text { animation: float-text 2.5s ease-in-out infinite; }

    .btn-vip-gradient {
      background: linear-gradient(135deg, #ff7e5f, #feb47b, #ffcc00);
      background-size: 200% 200%;
      animation: gradient-anim 4s ease infinite;
      box-shadow: 0 10px 25px rgba(255, 126, 95, 0.4);
      transition: all 0.3s ease;
    }
    @keyframes gradient-anim {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn-vip-gradient:hover { transform: scale(1.04); box-shadow: 0 15px 30px rgba(255, 204, 0, 0.6); }

    /* ========================================== */
    /* PRODUCT SCROLL REVEAL & FLOATING UI        */
    /* ========================================== */
    .toy-card-reveal {
      opacity: 0;
      transform: translateY(45px) scale(0.92);
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .toy-card-reveal.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @keyframes card-gentle-wave {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    .toy-card-reveal.is-visible.wave-even {
      animation: card-gentle-wave 3.8s ease-in-out infinite 0.7s;
    }

    .toy-card-reveal.is-visible.wave-odd {
      animation: card-gentle-wave 4.2s ease-in-out infinite 1.4s;
    }

    .toy-card-reveal:hover, .toy-card-reveal:active {
      animation-play-state: paused !important;
      transform: translateY(-8px) scale(1.03) !important;
      box-shadow: 0 20px 35px rgba(245, 158, 11, 0.22) !important;
      border-color: #fbbf24 !important;
    }

    /* ========================================== */
    /* CATEGORY DRAWER SEQUENTIAL ANIMATIONS      */
    /* ========================================== */
    #categoryDrawerContainer {
      visibility: hidden;
      transition: visibility 0.3s ease;
    }
    #categoryDrawerContainer:not(.hidden) {
      visibility: visible;
    }

    .drawer-backdrop {
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #categoryDrawerContainer:not(.hidden) .drawer-backdrop {
      opacity: 1;
    }

    .drawer-panel {
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #categoryDrawerContainer:not(.hidden) .drawer-panel {
      transform: translateX(0);
    }

    /* Sequential slide-in for each category item */
    #categoryDrawerContainer:not(.hidden) .drawer-category-item {
      opacity: 0;
      transform: translateX(-25px);
      animation: categorySlideIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes categorySlideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>

<style id="hts-3d-edge-splash-css">
  /* Force Full-Viewport Edge-to-Edge Layout on Mobile (No Empty Space Outside Yellow Line) */
  #vipSplashScreen {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100dvh !important;
    padding: 3px !important;
    margin: 0 !important;
    display: flex !important;
    align-items: stretch !important;
    justify-content: center !important;
    background: #fffbeb !important;
    z-index: 9999 !important;
    box-sizing: border-box !important;
  }

  /* 3D Animated Yellow Border Card Merged to Screen Edges */
  #vipSplashScreen > div,
  #vipSplashScreen .splash-card-3d {
    width: 100% !important;
    max-width: 100% !important;
    height: 100% !important;
    max-height: 100% !important;
    margin: 0 !important;
    border-radius: 26px !important;
    border: 4px solid #FBBF24 !important;
    background: radial-gradient(circle at 50% 30%, #ffffff 0%, #fffdf7 70%, #fef9e7 100%) !important;
    box-shadow:
      0 0 0 1.5px #F59E0B,
      inset 0 2px 6px rgba(255, 255, 255, 0.95),
      inset 0 -6px 16px rgba(245, 158, 11, 0.14),
      0 12px 32px rgba(245, 158, 11, 0.28) !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
    padding: 12px 14px 16px 14px !important;
    position: relative !important;
    overflow: hidden !important;
    box-sizing: border-box !important;
    animation: htsBorderPulse3D 3s ease-in-out infinite !important;
  }

  /* Animated 3D Golden Shimmer Along Yellow Border */
  #vipSplashScreen > div::before,
  #vipSplashScreen .splash-card-3d::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 22px;
    padding: 3px;
    background: linear-gradient(120deg, transparent 20%, rgba(254, 240, 138, 0.95) 50%, transparent 80%);
    background-size: 200% 200%;
    animation: htsGoldSweep 3.5s linear infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 25;
  }

  /* Desktop / Tablet Preview Neat Centering */
  @media (min-width: 640px) {
    #vipSplashScreen {
      padding: 16px !important;
      align-items: center !important;
    }
    #vipSplashScreen > div,
    #vipSplashScreen .splash-card-3d {
      max-width: 430px !important;
      max-height: 94dvh !important;
      border-radius: 32px !important;
    }
  }

  /* Top Video Box Full Width & 3D Depth */
  .hts-video-frame-3d {
    width: 100% !important;
    height: 33dvh !important;
    min-height: 195px !important;
    max-height: 270px !important;
    border-radius: 20px !important;
    overflow: hidden !important;
    position: relative !important;
    box-shadow:
      0 10px 24px -6px rgba(15, 23, 42, 0.18),
      0 0 0 2px rgba(251, 191, 36, 0.35) !important;
    background: #0f172a !important;
    flex-shrink: 0 !important;
  }

  .hts-video-frame-3d video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    display: block !important;
  }

  /* 3D Title Text */
  .hts-title-3d {
    font-size: clamp(1.45rem, 6.3vw, 1.85rem) !important;
    font-weight: 900 !important;
    letter-spacing: 0.02em !important;
    color: #F59E0B !important;
    text-shadow:
      0 2px 0 #FEF3C7,
      0 4px 10px rgba(245, 158, 11, 0.28) !important;
    line-height: 1.15 !important;
    text-align: center !important;
  }

  /* 3D Floating Teddy Circle */
  .hts-teddy-badge-3d {
    width: 84px !important;
    height: 84px !important;
    border-radius: 9999px !important;
    border: 3.5px solid #FBBF24 !important;
    background: radial-gradient(circle at 35% 30%, #ffffff, #fef3c7) !important;
    box-shadow:
      0 8px 20px -4px rgba(245, 158, 11, 0.4),
      inset 0 2px 4px rgba(255, 255, 255, 0.9) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    margin: 0 auto !important;
    animation: htsTeddyFloat3D 3s ease-in-out infinite !important;
  }

  /* 3D Feature Mini-Cards */
  .hts-feature-card-3d {
    border-radius: 18px !important;
    padding: 12px 6px !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    box-shadow:
      0 6px 14px -4px rgba(15, 23, 42, 0.08),
      inset 0 1.5px 0 rgba(255, 255, 255, 0.85) !important;
    transition: transform 0.2s ease !important;
  }
  .hts-feature-card-3d:active {
    transform: translateY(2px) scale(0.97) !important;
  }

  /* 3D Pushable Enter Store Button */
  .hts-enter-btn-3d {
    width: 100% !important;
    height: 58px !important;
    border-radius: 9999px !important;
    background: linear-gradient(180deg, #FB923C 0%, #F97316 55%, #EA580C 100%) !important;
    color: #ffffff !important;
    font-size: 1.22rem !important;
    font-weight: 800 !important;
    box-shadow:
      0 5px 0 #C2410C,
      0 12px 24px -4px rgba(234, 88, 12, 0.45),
      inset 0 2px 2px rgba(255, 255, 255, 0.45) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 10px !important;
    position: relative !important;
    overflow: hidden !important;
    transition: all 0.15s ease !important;
  }
  .hts-enter-btn-3d:active {
    transform: translateY(4px) !important;
    box-shadow:
      0 1px 0 #C2410C,
      0 6px 12px -2px rgba(234, 88, 12, 0.4) !important;
  }
  .hts-enter-btn-3d::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    transform: skewX(-20deg);
    animation: htsBtnShine 3.2s infinite;
  }

  @keyframes htsBorderPulse3D {
    0%, 100% {
      box-shadow:
        0 0 0 1.5px #F59E0B,
        inset 0 2px 6px rgba(255, 255, 255, 0.95),
        inset 0 -6px 16px rgba(245, 158, 11, 0.14),
        0 10px 28px rgba(245, 158, 11, 0.25);
    }
    50% {
      box-shadow:
        0 0 0 2.5px #F59E0B,
        inset 0 2px 8px rgba(255, 255, 255, 1),
        inset 0 -8px 20px rgba(245, 158, 11, 0.22),
        0 14px 36px rgba(245, 158, 11, 0.42);
    }
  }

  @keyframes htsGoldSweep {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  @keyframes htsTeddyFloat3D {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-5px) scale(1.04); }
  }

  @keyframes htsBtnShine {
    0% { left: -100%; }
    45%, 100% { left: 160%; }
  }
</style>


<style>
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in-up {
    animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
</style>
  
<style id="hts-3d-fix-styles">
  .hts-3d-grid {
    perspective: 1200px;
    transform-style: preserve-3d;
  }
  .toy-card-3d {
    opacity: 0;
    transform: perspective(1000px) translate3d(0, 70px, -110px) rotateX(30deg) rotateY(-8deg) scale(0.82);
    transform-origin: center top;
    will-change: transform, opacity;
    backface-visibility: hidden;
  }
  .toy-card-3d.animate-3d-in {
    animation: htsCard3DReveal 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .toy-card-visible {
    opacity: 1;
    transform: none;
  }
  @keyframes htsCard3DReveal {
    0% {
      opacity: 0;
      transform: perspective(1000px) translate3d(0, 70px, -110px) rotateX(30deg) rotateY(-8deg) scale(0.82);
    }
    68% {
      opacity: 1;
      transform: perspective(1000px) translate3d(0, -6px, 18px) rotateX(-4deg) rotateY(2deg) scale(1.03);
    }
    100% {
      opacity: 1;
      transform: perspective(1000px) translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) scale(1);
    }
  }
</style>
</head>
<body class="min-h-screen flex flex-col splash-active bg-slate-50">

  <!-- VIP SPLASH MODAL WINDOW -->
  <div id="vipSplashScreen" class="fixed inset-0 z-[100] flex items-center justify-center bg-gradient-to-br from-sky-100 via-amber-50 to-pink-100 p-4 sm:p-6 transition-all duration-700 overflow-y-auto">
    
    <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-[0_25px_60px_rgba(0,0,0,0.15)] border-4 border-amber-300 overflow-hidden relative flex flex-col my-auto p-5 sm:p-6">
      
      <!-- Close Button -->
      <button onclick="HappyToysApp.enterStore()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 z-50 p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>

      <!-- INSTANT STREAMING VIDEO SECTION -->
      <div class="w-full aspect-video bg-amber-50/50 rounded-2xl overflow-hidden shadow-sm relative flex items-center justify-center border-2 border-amber-100 mb-5">
        <video id="splashVideoPlayer" src="/api/splash-media" preload="auto" class="w-full h-full object-cover z-10" controls autoplay loop playsinline></video>
        <img id="splashImgPlayer" class="w-full h-full object-cover hidden z-10" alt="Splash Image" />
        
        <button id="unmuteNoticeBtn" class="hidden absolute top-3 left-3 z-30 bg-amber-500/95 hover:bg-amber-600 text-white text-xs font-black px-3.5 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 animate-bounce">
          <span>🔊</span> <span>Tap for Sound</span>
        </button>
      </div>

      <!-- STORE NAME -->
      <div class="text-center flex flex-col items-center">
        <h1 class="toy-title-font text-2xl sm:text-3xl text-amber-500 tracking-wide uppercase mb-1 animate-float-text drop-shadow-sm">
          HAPPY TOYS STORE
        </h1>
        <p class="text-slate-500 text-xs sm:text-sm font-bold mb-4 tracking-wide">
          ✨ Best Toys for Every Smile ✨
        </p>

        <!-- Animated Teddy Badge -->
        <div class="w-16 h-16 rounded-full bg-amber-100 border-4 border-amber-400 shadow-inner flex items-center justify-center text-3xl mb-4 animate-float-text relative">
          🧸
          <span class="absolute -top-1 -right-1 text-xs">✨</span>
        </div>

        <!-- Key Features Cards -->
        <div class="grid grid-cols-3 gap-2 w-full mb-5">
          <div class="bg-sky-50 border border-sky-100 rounded-2xl p-2.5 flex flex-col items-center shadow-xs">
            <span class="text-lg mb-1">🛡️</span>
            <span class="text-[9px] font-extrabold text-sky-800 uppercase tracking-tighter">PREMIUM QUALITY</span>
          </div>
          <div class="bg-amber-50 border border-amber-100 rounded-2xl p-2.5 flex flex-col items-center shadow-xs">
            <span class="text-lg mb-1">🚀</span>
            <span class="text-[9px] font-extrabold text-amber-800 uppercase tracking-tighter">FAST DELIVERY</span>
          </div>
          <div class="bg-pink-50 border border-pink-100 rounded-2xl p-2.5 flex flex-col items-center shadow-xs">
            <span class="text-lg mb-1">😊</span>
            <span class="text-[9px] font-extrabold text-pink-800 uppercase tracking-tighter">HAPPY KIDS</span>
          </div>
        </div>

        <!-- Enter Store Button -->
        <button onclick="HappyToysApp.enterStore()" class="btn-vip-gradient w-full py-3.5 rounded-2xl text-white font-black text-lg flex items-center justify-center gap-2 shadow-md cursor-pointer">
          <span>Enter Store ➔</span>
        </button>
      </div>

    </div>
  </div>

  <!-- MAIN STORE CONTENT -->
  <div id="mainStoreContent" class="flex flex-col flex-1 opacity-0 h-0 overflow-hidden bg-slate-50">
    <div class="rainbow-bar"></div>
    <div class="bg-slate-900 text-white text-xs sm:text-sm py-2 px-4 text-center font-medium">
      🎉 Welcome to Happy Toys Store! Fast Delivery Across Pakistan
    </div>

    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <button id="openCategoryDrawerBtn" class="p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 6h16M4 12h16M4 18h10"/></svg></button>
          <a href="#" onclick="HappyToysApp.resetFilters(); return false;" class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-red-500 to-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-sm">🧸</div>
            <div>
              <span class="toy-title-font text-base text-amber-500 tracking-tight leading-none block">Happy Toys</span>
            </div>
          </a>
        </div>
        <div class="flex items-center gap-2 sm:gap-3">
          <a href="admin.html" class="text-xs sm:text-sm font-semibold px-3 py-2 rounded-xl bg-slate-100 text-slate-700">Admin</a>
          <button onclick="HappyToysCart.openDrawer()" class="px-3.5 py-2 rounded-xl bg-blue-600 text-white font-semibold text-xs sm:text-sm shadow-sm">🛒 Cart <span id="cartCountBadge" class="px-1.5 py-0.5 text-[11px] rounded-full bg-amber-400 text-slate-900 font-bold">0</span></button>
        </div>
      </div>
    </header>

    <!-- CATEGORIES SIDEBAR DRAWER WITH HOME BUTTON & SEQUENTIAL ANIMATIONS -->
    <div id="categoryDrawerContainer" class="fixed inset-0 z-50 hidden">
      <div id="categoryDrawerBackdrop" class="drawer-backdrop fixed inset-0 bg-black/50"></div>
      <aside class="drawer-panel relative z-10 w-80 max-w-[85vw] bg-white h-full shadow-2xl flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
          <span class="toy-title-font text-lg text-amber-500">🧸 Toy Categories</span>
          <button id="closeCategoryDrawerBtn" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-200 font-bold">✕</button>
        </div>
        
        <!-- Home / All Toys Quick Button -->
        <div class="p-3 border-b border-slate-100 bg-amber-50/40">
          <button onclick="HappyToysApp.resetFilters(); document.getElementById('categoryDrawerContainer').classList.add('hidden');" class="w-full text-left px-4 py-3 rounded-xl text-sm font-black text-amber-800 bg-amber-100 hover:bg-amber-200 transition flex items-center gap-3 shadow-xs">
            <span class="text-lg">🏠</span>
            <span>Home / All Toys</span>
          </button>
        </div>

        <div id="drawerCategoryList" class="p-3 overflow-y-auto space-y-1.5 flex-1"></div>
      </aside>
    </div>

    <main class="flex-1">
      <section class="bg-white border-b border-slate-200 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 py-3">
          <div id="horizontalCategoryBar" class="flex items-center gap-3 overflow-x-auto no-scrollbar py-1"></div>
        </div>
      </section>

      <section class="max-w-7xl mx-auto px-4 py-8">
        <h2 id="activeCategoryHeading" class="toy-title-font text-2xl text-slate-800 mb-6">All Toys</h2>
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5"></div>
      </section>
    </main>
  </div>

  <script src="js/data-seed.js"></script>
  <script src="js/product-modal.js"></script>
  <script src="js/cart-whatsapp.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
       if(typeof confetti === 'function') {
           confetti({ particleCount: 120, spread: 100, origin: { y: 0.8 } });
           var duration = 15 * 1000;
           var animationEnd = Date.now() + duration;
           var interval = setInterval(function() {
             var timeLeft = animationEnd - Date.now();
             if (timeLeft <= 0) return clearInterval(interval);
             confetti({ particleCount: 8, angle: 60, spread: 55, origin: { x: 0, y: 1 } });
             confetti({ particleCount: 8, angle: 120, spread: 55, origin: { x: 1, y: 1 } });
           }, 300);
       }
    });
  </script>
</body>
</html>
