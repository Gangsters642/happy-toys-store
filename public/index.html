<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Toys Store | Premium Kids Toys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body.splash-active { overflow: hidden; }
    
    .toy-title-font {
      font-family: 'Fredoka One', cursive, sans-serif;
      text-shadow: 3px 3px 0px #ff6b6b, 6px 6px 0px #4ecdc4, 9px 9px 0px #ffe66d;
    }

    @keyframes bounce-slow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-bounce-slow { animation: bounce-slow 3s ease-in-out infinite; }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 15px rgba(255, 107, 107, 0.4); transform: scale(1); }
      50% { box-shadow: 0 0 30px rgba(255, 107, 107, 0.8); transform: scale(1.03); }
      100% { box-shadow: 0 0 15px rgba(255, 107, 107, 0.4); transform: scale(1); }
    }
    .btn-toy-rainbow {
      background: linear-gradient(135deg, #ff6b6b, #ffbe0b, #3a86ff);
      background-size: 200% 200%;
      animation: rainbow-bg 5s ease infinite;
      box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
      transition: all 0.3s ease;
    }
    @keyframes rainbow-bg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn-toy-rainbow:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(58, 134, 255, 0.6); }

    /* Colorful animated background */
    @keyframes float-shape {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .floating-shape-1 { animation: float-shape 6s ease-in-out infinite; }
    .floating-shape-2 { animation: float-shape 8s ease-in-out infinite 1s; }
  </style>
</head>
<body class="min-h-screen flex flex-col splash-active bg-slate-100">

  <!-- BRIGHT, COLORFUL, TOY-STORE SPLASH MODAL -->
  <div id="vipSplashScreen" class="fixed inset-0 z-[100] flex items-center justify-center bg-gradient-to-br from-sky-100 via-amber-50 to-pink-100 p-3 sm:p-6 transition-all duration-700 overflow-y-auto">
    
    <!-- Floating background decorative elements -->
    <div class="absolute top-6 left-10 text-4xl floating-shape-1 opacity-70 pointer-events-none">🎈</div>
    <div class="absolute bottom-10 right-10 text-4xl floating-shape-2 opacity-70 pointer-events-none">🧸</div>
    <div class="absolute top-1/3 right-12 text-3xl floating-shape-1 opacity-65 pointer-events-none">⭐</div>

    <!-- Main White Clean Container -->
    <div class="w-full max-w-xl bg-white rounded-[2.5rem] shadow-[0_20px_60px_rgba(0,0,0,0.15)] border-4 border-amber-200 overflow-hidden relative flex flex-col my-auto">
      
      <!-- Close Button -->
      <button onclick="HappyToysApp.enterStore()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 z-50 p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>

      <!-- TOP SECTION: STANDALONE VIDEO/MEDIA CONTAINER -->
      <div class="p-4 sm:p-6 pb-2">
        <div class="w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden shadow-inner relative flex items-center justify-center border-2 border-slate-200">
          <div id="splashMediaPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400">
            <span class="text-xs font-bold">Loading Toy Video...</span>
          </div>
          <video id="splashVideoPlayer" class="w-full h-full object-cover hidden z-10" controls autoplay loop muted playsinline></video>
          <img id="splashImgPlayer" class="w-full h-full object-cover hidden z-10" alt="Splash Image" />
        </div>
      </div>

      <!-- BOTTOM SECTION: STORE DETAILS & COLORFUL FONTS -->
      <div class="px-6 pb-6 pt-2 text-center flex flex-col items-center">
        
        <!-- Colorful 3D Style Heading -->
        <h1 class="toy-title-font text-3xl sm:text-4xl text-amber-500 tracking-wide uppercase mb-2 animate-bounce-slow pt-2">
          Happy Toys Store
        </h1>
        <p class="text-slate-600 text-sm font-bold tracking-wide mb-5">
          ✨ Best Toys for Every Smile ✨
        </p>

        <!-- Animated Teddy Bear Badge in Circle -->
        <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-amber-200 to-yellow-100 border-4 border-amber-400 shadow-md flex items-center justify-center text-4xl mb-6 animate-bounce-slow relative">
          🧸
          <span class="absolute -top-1 -right-1 text-sm">✨</span>
        </div>

        <!-- Key Features Cards (Colorful Icons) -->
        <div class="grid grid-cols-3 gap-3 w-full mb-6">
          <div class="bg-sky-50 border border-sky-200 rounded-2xl p-3 flex flex-col items-center">
            <span class="text-xl mb-1">🛡️</span>
            <span class="text-[10px] font-extrabold text-sky-800 uppercase">Premium Quality</span>
          </div>
          <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 flex flex-col items-center">
            <span class="text-xl mb-1">🚀</span>
            <span class="text-[10px] font-extrabold text-amber-800 uppercase">Fast Delivery</span>
          </div>
          <div class="bg-pink-50 border border-pink-200 rounded-2xl p-3 flex flex-col items-center">
            <span class="text-xl mb-1">😊</span>
            <span class="text-[10px] font-extrabold text-pink-800 uppercase">Happy Kids</span>
          </div>
        </div>

        <!-- Colorful Enter Store Button -->
        <button onclick="HappyToysApp.enterStore()" class="btn-toy-rainbow w-full py-4 rounded-2xl text-white font-black text-lg sm:text-xl flex items-center justify-center gap-3 shadow-lg">
          <span>Enter Store ➔</span>
        </button>

      </div>
    </div>
  </div>

  <!-- MAIN STORE CONTENT -->
  <div id="mainStoreContent" class="flex flex-col flex-1 opacity-0 h-0 overflow-hidden">
    <div class="rainbow-bar"></div>
    <div class="bg-slate-900 text-white text-xs sm:text-sm py-2 px-4 text-center font-medium">
      🎉 Welcome to Happy Toys Store! Fast Delivery Across Pakistan
    </div>

    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <button id="openCategoryDrawerBtn" class="p-2 rounded-xl bg-slate-100 text-slate-700"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 6h16M4 12h16M4 18h10"/></svg></button>
          <a href="#" onclick="HappyToysApp.resetFilters(); return false;" class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-red-500 to-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-sm">🧸</div>
            <div>
              <span class="toy-title-font text-lg text-amber-500 tracking-tight leading-none block">Happy Toys</span>
            </div>
          </a>
        </div>
        <div class="flex items-center gap-2 sm:gap-3">
          <a href="admin.html" class="text-xs sm:text-sm font-semibold px-3 py-2 rounded-xl bg-slate-100 text-slate-700">Admin</a>
          <button onclick="HappyToysCart.openDrawer()" class="px-3.5 py-2 rounded-xl bg-blue-600 text-white font-semibold text-xs sm:text-sm">🛒 Cart <span id="cartCountBadge" class="px-1.5 py-0.5 text-[11px] rounded-full bg-amber-400 text-slate-900 font-bold">0</span></button>
        </div>
      </div>
    </header>

    <div id="categoryDrawerContainer" class="fixed inset-0 z-50 hidden">
      <div id="categoryDrawerBackdrop" class="drawer-backdrop fixed inset-0"></div>
      <aside class="drawer-panel relative z-10 w-80 max-w-[85vw] bg-white h-full shadow-2xl flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between bg-slate-50">
          <span class="font-bold">🧸 Categories</span>
          <button id="closeCategoryDrawerBtn" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-200">✕</button>
        </div>
        <div id="drawerCategoryList" class="p-3 overflow-y-auto space-y-1"></div>
      </aside>
    </div>

    <main class="flex-1">
      <section class="bg-white border-b border-slate-200"><div class="max-w-7xl mx-auto px-4 py-3"><div id="horizontalCategoryBar" class="flex items-center gap-2 overflow-x-auto no-scrollbar"></div></div></section>
      <section class="max-w-7xl mx-auto px-4 py-8">
        <h2 id="activeCategoryHeading" class="text-2xl font-bold mb-6">All Toys</h2>
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>
    </main>
  </div>

  <script src="js/data-seed.js"></script>
  <script src="js/product-modal.js"></script>
  <script src="js/cart-whatsapp.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
